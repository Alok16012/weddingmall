<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon-mark.webp" />
    <!-- Full logo lockup: what iOS uses for "Add to Home Screen". -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#ff5a52" />
    <meta name="description" content="Wedding Mall — India's Fastest Emerging Online Wedding Marketplace. Discover wedding venues, banquet halls, marriage gardens and resorts, compare vendors and send enquiries. Plus a free matrimonial biodata maker." />
    <link rel="canonical" href="https://www.weddingmall.online/" />

    <!-- Open Graph / social cards. The brand shown is "Wedding Mall"; the
         domain stays in the URL fields where it belongs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wedding Mall" />
    <meta property="og:title" content="Wedding Mall — India's Wedding Marketplace" />
    <meta property="og:description" content="One Destination. Endless Wedding Possibilities. Discover venues and vendors, compare, shortlist and enquire." />
    <meta property="og:url" content="https://www.weddingmall.online/" />
    <meta property="og:image" content="https://www.weddingmall.online/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wedding Mall — India's Wedding Marketplace" />
    <meta name="twitter:description" content="One Destination. Endless Wedding Possibilities." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <title>Wedding Mall — India's Wedding Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
